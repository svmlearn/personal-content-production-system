server {
    server_name 2young.xin www.2young.xin _;

    root /opt/personal-website/apps/portfolio;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /styles.css {
        try_files /styles.css =404;
    }

    location = /script.js {
        try_files /script.js =404;
    }

    location / {
        try_files $uri $uri/ @content_growth;
    }

    location @content_growth {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/2young.xin/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/2young.xin/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

